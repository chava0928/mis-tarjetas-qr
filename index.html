<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tarjetas QR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            text-align: center;
        }
        h1 { font-size: 36px; margin-bottom: 15px; }
        p { font-size: 18px; margin-bottom: 35px; max-width: 500px; opacity: 0.95; }
        .boton {
            padding: 16px 32px;
            background: white;
            color: #1e40af;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s;
        }
        .boton:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <h1>📇 Mis Tarjetas QR</h1>
    <p>Bienvenido a tu herramienta para crear tarjetas digitales profesionales. Entra para empezar a trabajar.</p>
    <a href="herramienta-completa.html" class="boton">🚀 Ir a la Herramienta</a>
</body>
</html>
