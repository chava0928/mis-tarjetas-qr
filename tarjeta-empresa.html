    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .tarjeta { width: 100%; max-width: 380px; background: white; border-radius: 16px; overflow: hidden; border: 1px solid #eee; padding-bottom: 10px; }
        .portada { width: 100%; height: 200px; background: #2563eb; background-size: cover; background-position: center; }
        .foto-perfil { width: 130px; height: 130px; border-radius: 50%; border: 5px solid white; margin: -65px auto 15px; background: #e5e7eb; display: flex; align-items: center; justify-content: center; font-size: 48px; color: #9ca3af; overflow: hidden; background-size: cover; background-position: center; }
        .nombre { text-align: center; font-size: 28px; font-weight: bold; color: #111; margin-bottom: 5px; padding: 0 10px; }
        .cargo { text-align: center; font-size: 18px; color: #6b7280; margin-bottom: 25px; padding: 0 10px; }
        .dato { display: flex; align-items: center; gap: 12px; padding: 10px 25px; color: #374151; font-size: 15px; text-decoration: none; }
        .icono { font-size: 22px; width: 25px; text-align: center; flex-shrink: 0; }
        .boton-guardar { display: block; margin: 25px auto; padding: 14px 30px; background: #2563eb; color: white; text-align: center; border-radius: 50px; font-weight: bold; text-decoration: none; width: fit-content; }
